name: phone-booth

x-datastore-environment: &datastore-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://phone_booth:phone_booth_dev@postgres:5432/phone_booth}
  VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}

services:
  api:
    image: project-booth-api:local
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      <<: *datastore-environment
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 3000
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-disabled}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      ACCOUNT_DELETION_DELAY_SECONDS: ${ACCOUNT_DELETION_DELAY_SECONDS:-0}
      MATCHMAKING_READY_TIMEOUT_SECONDS: ${MATCHMAKING_READY_TIMEOUT_SECONDS:-15}
      MATCH_LOBBY_READY_TIMEOUT_SECONDS: ${MATCH_LOBBY_READY_TIMEOUT_SECONDS:-30}
      MATCHMAKING_RECENT_PAIRING_SECONDS: ${MATCHMAKING_RECENT_PAIRING_SECONDS:-86400}
      REALTIME_HEARTBEAT_INTERVAL_MS: ${REALTIME_HEARTBEAT_INTERVAL_MS:-10000}
      REALTIME_HEARTBEAT_TIMEOUT_MS: ${REALTIME_HEARTBEAT_TIMEOUT_MS:-30000}
      REALTIME_RESUME_LIMIT: ${REALTIME_RESUME_LIMIT:-100}
      CHAT_MODERATION_PROVIDER: ${CHAT_MODERATION_PROVIDER:-disabled}
      CHAT_MODERATION_TIMEOUT_MS: ${CHAT_MODERATION_TIMEOUT_MS:-1500}
      CHAT_MAX_TYPED_CHARACTERS: ${CHAT_MAX_TYPED_CHARACTERS:-240}
      CHAT_RATE_WINDOW_SECONDS: ${CHAT_RATE_WINDOW_SECONDS:-10}
      CHAT_USER_RATE_LIMIT: ${CHAT_USER_RATE_LIMIT:-6}
      CHAT_THREAD_RATE_LIMIT: ${CHAT_THREAD_RATE_LIMIT:-4}
      CHAT_DUPLICATE_WINDOW_SECONDS: ${CHAT_DUPLICATE_WINDOW_SECONDS:-30}
      CHAT_RAPID_TARGET_LIMIT: ${CHAT_RAPID_TARGET_LIMIT:-3}
    ports:
      - "127.0.0.1:${PHONE_BOOTH_API_PORT:-3000}:3000"
    restart: "no"

  worker:
    image: project-booth-api:local
    pull_policy: never
    command: ["node", "services/backend/dist/src/worker-main.js"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      <<: *datastore-environment
      LOG_LEVEL: info
      NODE_ENV: production
      WORKER_READY_FILE: /tmp/project-booth-worker-ready
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync(process.env.WORKER_READY_FILE)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 5
    restart: "no"

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: phone_booth
      POSTGRES_PASSWORD: phone_booth_dev
      POSTGRES_USER: phone_booth
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "phone_booth", "-d", "phone_booth"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    ports:
      - "127.0.0.1:${PHONE_BOOTH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: "no"

  valkey:
    image: valkey/valkey:9.1.0-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 10
    volumes:
      - valkey-data:/data
    restart: "no"

volumes:
  postgres-data:
    name: phone-booth-postgres-data
  valkey-data:
    name: phone-booth-valkey-data
