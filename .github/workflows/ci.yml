name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: phone_booth_test
          POSTGRES_PASSWORD: phone_booth_test
          POSTGRES_USER: phone_booth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phone_booth -d phone_booth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://phone_booth:phone_booth_test@127.0.0.1:5432/phone_booth_test

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace verification
        run: pnpm verify

  build-backend-image:
    name: Build backend image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build production image
        run: >-
          docker build
          --file services/backend/Dockerfile
          --tag project-booth-api:ci
          .
