openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

info:
  title: Project Booth API
  summary: Platform-neutral API contract for Project Booth clients.
  description: |
    Product endpoints use path versioning beginning with `/v1`. Operational
    liveness remains at the unversioned `/health/live` path so container
    orchestration does not depend on a product API version.

    Identity endpoints exchange provider credentials for Project Booth
    sessions. Game endpoints trust only the resulting internal account and
    never a platform-provider identifier.
  version: 0.5.0

x-project-booth-api-conventions:
  contractVersion: 1
  productPathPrefix: /v1
  unversionedPaths:
    - /health/live

servers:
  - url: "{scheme}://{authority}"
    description: Environment-selected API origin.
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
        description: HTTPS in deployed environments; HTTP is local-only.
      authority:
        default: api.invalid
        description: Host and optional port supplied by the client environment.

tags:
  - name: Health
    description: Operational process-health endpoints.
  - name: Identity
    description: Provider credential exchange and session lifecycle.
  - name: Account
    description: Private account state and deletion.
  - name: Profile
    description: Pseudonymous player profiles.
  - name: Matchmaking
    description: Durable queue tickets and ready confirmation.
  - name: Matches
    description: Match entry and recipient-safe snapshots.
  - name: Realtime
    description: Cursor-based recovery for real-time delivery.
  - name: Chat
    description: Match-private text threads and safe message delivery.
  - name: Safety
    description: Match mute, report, and future-pairing block commands.
  - name: Economy
    description: Private wallet balances, match allowances, and formal bribes.

security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Check API process liveness
      description: |
        Reports whether the API process can serve requests. This endpoint does
        not check PostgreSQL, Valkey, or downstream service readiness.
      operationId: getLiveHealth
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
              examples:
                live:
                  summary: Live API process
                  value:
                    status: ok

  /v1/auth/exchange:
    post:
      tags:
        - Identity
      summary: Exchange an identity-provider credential
      operationId: exchangeIdentityCredential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentialRequest"
      responses:
        "201":
          description: The credential was verified and a session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeCredentialResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/refresh:
    post:
      tags:
        - Identity
      summary: Rotate a refresh token
      operationId: refreshIdentitySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: A fresh access and refresh token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/logout:
    post:
      tags:
        - Identity
      summary: Revoke the current session
      operationId: logoutIdentitySession
      responses:
        "204":
          description: The current session was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/account:
    get:
      tags:
        - Account
      summary: Get the current private account projection
      operationId: getCurrentAccount
      responses:
        "200":
          description: Current account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Account
      summary: Request account deletion
      description: |
        Immediately revokes every account session and queues asynchronous
        identity and profile cleanup. A retained internal tombstone preserves
        referential integrity for match and safety history.
      operationId: requestAccountDeletion
      responses:
        "202":
          description: Deletion is pending or was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/profile:
    patch:
      tags:
        - Profile
      summary: Update the current pseudonymous profile
      operationId: updateCurrentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/profiles/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Internal Project Booth player identifier.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Profile
      summary: Get a match-safe public profile
      operationId: getPublicProfile
      responses:
        "200":
          description: Match-safe pseudonymous profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matchmaking/tickets:
    post:
      tags:
        - Matchmaking
      summary: Create or recover the account's active matchmaking ticket
      operationId: createMatchmakingTicket
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchmakingTicketRequest"
      responses:
        "200":
          description: The account already had an active ticket.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingTicket"
        "201":
          description: A durable ticket was created.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matchmaking/tickets/{ticketId}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      tags:
        - Matchmaking
      summary: Inspect a matchmaking ticket
      operationId: getMatchmakingTicket
      responses:
        "200":
          description: Current durable ticket state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matchmaking/tickets/{ticketId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      tags:
        - Matchmaking
      summary: Cancel a matchmaking ticket
      operationId: cancelMatchmakingTicket
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The terminal or newly cancelled ticket.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matchmaking/tickets/{ticketId}/ready:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      tags:
        - Matchmaking
      summary: Confirm readiness for a proposed roster
      operationId: confirmMatchmakingReady
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ticket state after the idempotent ready command.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchmakingTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/ready:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags:
        - Matches
      summary: Confirm that the contestant entered the booth
      operationId: confirmBoothReady
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current match entry state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReady"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags:
        - Matches
      summary: Get an account-safe authoritative match snapshot
      operationId: getMatchSnapshot
      responses:
        "200":
          description: Snapshot and the recipient cursor captured with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/economy/wallet:
    get:
      tags:
        - Economy
      summary: Get the account's private coin buckets and optional match allowance
      operationId: getCoinWallet
      parameters:
        - name: matchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-authoritative wallet projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinWallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/ballot:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags:
        - Matches
      summary: Submit or revise a normal elimination ballot
      description: |
        The first valid ballot atomically settles every current-round incoming
        bribe, regardless of whether its requested target is selected.
      operationId: submitNormalBallot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Private ballot acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalBallotAcknowledgement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/bribes:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags:
        - Economy
      summary: List only the match offers visible to the current account
      operationId: listVisibleBribeOffers
      responses:
        "200":
          description: Sender-or-recipient scoped offers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - offers
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/BribeOffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Economy
      summary: Create or replace the sender's pending offer to one recipient
      operationId: createBribeOffer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBribeOfferRequest"
      responses:
        "200":
          description: A prior pending pair offer was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BribeOffer"
        "201":
          description: A new pending offer was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BribeOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/bribes/{offerId}/accept:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      tags:
        - Economy
      summary: Atomically accept an unexpired offer
      operationId: acceptBribeOffer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Accepted offer and its private state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BribeOffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/bribes/{offerId}/decline:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      tags:
        - Economy
      summary: Decline a pending offer
      operationId: declineBribeOffer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Declined offer and its private state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BribeOffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/chat/quick-phrases:
    get:
      tags:
        - Chat
      summary: List provider-independent structured chat phrases
      operationId: listChatQuickPhrases
      responses:
        "200":
          description: The versioned server-owned quick phrase catalog.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - quickPhrases
                properties:
                  quickPhrases:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuickPhrase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/chat/threads:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags:
        - Chat
      summary: List the active contestant's match-private threads
      operationId: listMatchChatThreads
      responses:
        "200":
          description: One private thread for every other active contestant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - threads
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/chat/threads/{threadId}/messages:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/ThreadId"
    get:
      tags:
        - Chat
      summary: List delivered messages in a private thread
      operationId: listChatMessages
      parameters:
        - name: afterMessageId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Delivered messages visible to both thread members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Chat
      summary: Submit typed text or a structured quick phrase
      description: |
        Typed text is normalized, deterministically filtered, rate limited,
        and classified before delivery. Quick phrases remain available when
        the replaceable free-text moderation provider is unavailable.
      operationId: sendChatMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "201":
          description: The message was persisted and delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chat is locked or the recipient is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAttemptOrError"
        "422":
          description: Safety policy blocked the message without delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageAttempt"
        "429":
          description: A per-user, per-thread, duplicate, or target-switch limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageAttempt"
        "503":
          description: Free text failed closed because moderation is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAttemptOrError"

  /v1/matches/{matchId}/chat/users/{subjectUserId}/mute:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/SubjectUserId"
    post:
      tags:
        - Safety
      summary: Mute a contestant for the current match
      operationId: muteMatchContestant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The match-scoped mute is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/chat/users/{subjectUserId}/block:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/SubjectUserId"
    post:
      tags:
        - Safety
      summary: Block a contestant from communication and future matchmaking
      operationId: blockMatchContestant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The durable block is active without changing match state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/chat/messages/{messageId}/report:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags:
        - Safety
      summary: Report a delivered private message
      operationId: reportChatMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateReport"
      responses:
        "201":
          description: Evidence was preserved and the report was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/matches/{matchId}/chat/users/{subjectUserId}/report:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/SubjectUserId"
    post:
      tags:
        - Safety
      summary: Report a contestant's match behavior
      operationId: reportMatchContestant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateReport"
      responses:
        "201":
          description: Limited relevant evidence was preserved and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/realtime/events:
    get:
      tags:
        - Realtime
      summary: Resume the authenticated recipient event stream
      operationId: resumeRealtimeEvents
      parameters:
        - name: afterCursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A strictly ordered page of recipient-safe events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A short-lived Project Booth access token whose encoding is opaque to
        clients. Authentication behavior is implemented in a later milestone.

  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubjectUserId:
      name: subjectUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        RFC 9562 UUID generated for one mutation attempt. Keys are scoped to
        the authenticated account and operation; replay returns the original
        committed response.
      schema:
        type: string
        format: uuid

  headers:
    RequestId:
      description: Request trace identifier for support and diagnostics.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyReplayed:
      description: Whether this response replays an earlier committed result.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: Bearer authentication challenge.
      schema:
        type: string

  requestBodies:
    CreateReport:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - category
            properties:
              category:
                $ref: "#/components/schemas/ReportCategory"

  schemas:
    LiveHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
          description: Stable liveness status.

    DeviceRegistration:
      type: object
      additionalProperties: false
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          format: uuid
          description: App-installation identifier, not a hardware identifier.
        platform:
          type: string
          enum:
            - ios
            - test
        appVersion:
          type: string
          minLength: 1
          maxLength: 64

    ExchangeCredentialRequest:
      type: object
      additionalProperties: false
      required:
        - credential
        - device
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 8192
          description: |
            Provider credential selected by the server environment. Production
            Apple credentials are verified against Apple's signing keys.
        nonce:
          type: string
          minLength: 1
          maxLength: 128
        device:
          $ref: "#/components/schemas/DeviceRegistration"

    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256

    TokenPair:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - tokenType
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 256
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
        refreshTokenExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          const: Bearer

    PublicProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - avatarKey
        - progressionLevel
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 3
          maxLength: 24
        avatarKey:
          type: string
          minLength: 1
          maxLength: 64
        progressionLevel:
          type: integer
          minimum: 1

    Account:
      type: object
      additionalProperties: false
      required:
        - userId
        - status
        - deletionStatus
        - profile
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - deletion_pending
            - deleted
        deletionStatus:
          type: string
          enum:
            - none
            - pending
            - completed
        profile:
          $ref: "#/components/schemas/PublicProfile"

    ExchangeCredentialResponse:
      type: object
      additionalProperties: false
      required:
        - account
        - tokens
      properties:
        account:
          $ref: "#/components/schemas/Account"
        tokens:
          $ref: "#/components/schemas/TokenPair"

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128

    AccountDeletionAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - completed

    CreateMatchmakingTicketRequest:
      type: object
      additionalProperties: false
      required:
        - compatibilityVersion
        - language
        - region
      properties:
        compatibilityVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        language:
          type: string
          pattern: ^[a-z]{2,3}(?:-[A-Z]{2})?$
        region:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$

    MatchmakingTicket:
      type: object
      additionalProperties: false
      required:
        - compatibilityVersion
        - createdAt
        - language
        - readyConfirmed
        - region
        - rulesetId
        - rulesetVersion
        - status
        - ticketId
        - updatedAt
      properties:
        compatibilityVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        language:
          type: string
        matchId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        readyConfirmed:
          type: boolean
        readyDeadline:
          type: string
          format: date-time
        region:
          type: string
        rulesetId:
          type: string
          format: uuid
        rulesetVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - queued
            - proposed
            - matched
            - cancelled
        ticketId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time

    MatchReady:
      type: object
      additionalProperties: false
      required:
        - matchId
        - matchVersion
        - phase
        - phaseDeadline
        - ready
      properties:
        matchId:
          type: string
          format: uuid
        matchVersion:
          type: integer
          minimum: 1
        phase:
          type: string
        phaseDeadline:
          type:
            - string
            - "null"
          format: date-time
        ready:
          type: boolean

    NormalBallotAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - matchId
        - matchVersion
        - revision
        - submitted
      properties:
        matchId:
          type: string
          format: uuid
        matchVersion:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        submitted:
          type: boolean
          const: true

    CoinWallet:
      type: object
      additionalProperties: false
      required:
        - pending
        - reserved
        - restricted
        - spendable
      properties:
        matchAllowance:
          type: object
          additionalProperties: false
          required:
            - acceptedOutflow
            - cap
            - remaining
          properties:
            acceptedOutflow:
              type: integer
              minimum: 0
            cap:
              type: integer
              minimum: 1
            remaining:
              type: integer
              minimum: 0
        pending:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        restricted:
          type: boolean
        spendable:
          type: integer
          minimum: 0

    CreateBribeOfferRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - recipientUserId
        - requestedTargetUserId
      properties:
        amount:
          type: integer
          minimum: 1
        message:
          type: string
          minLength: 1
          maxLength: 2048
        recipientUserId:
          type: string
          format: uuid
        requestedTargetUserId:
          type: string
          format: uuid

    BribeOffer:
      type: object
      additionalProperties: false
      required:
        - amount
        - createdAt
        - expiresAt
        - matchId
        - offerId
        - recipientUserId
        - requestedTargetUserId
        - roundNumber
        - senderUserId
        - state
      properties:
        amount:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        filteredMessage:
          type: string
          minLength: 1
          maxLength: 240
        matchId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        requestedTargetUserId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          minimum: 1
        senderUserId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - declined
            - expired
            - accepted
            - reversed
            - settled

    MatchSnapshotRosterEntry:
      type: object
      additionalProperties: false
      required:
        - avatarKey
        - displayName
        - ready
        - status
        - userId
      properties:
        avatarKey:
          type: string
        displayName:
          type: string
        ready:
          type: boolean
        status:
          type: string
          enum:
            - active
            - eliminated
        userId:
          type: string
          format: uuid

    MatchSnapshot:
      type: object
      additionalProperties: false
      required:
        - lastRecipientCursor
        - matchId
        - matchVersion
        - phase
        - phaseDeadline
        - roster
        - ruleset
        - self
      properties:
        lastRecipientCursor:
          type: integer
          minimum: 0
        matchId:
          type: string
          format: uuid
        matchVersion:
          type: integer
          minimum: 1
        phase:
          type: string
        phaseDeadline:
          type:
            - string
            - "null"
          format: date-time
        roster:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MatchSnapshotRosterEntry"
        ruleset:
          type: object
          additionalProperties: false
          required:
            - rulesetId
            - rulesetVersion
          properties:
            rulesetId:
              type: string
              format: uuid
            rulesetVersion:
              type: integer
              minimum: 1
        self:
          type: object
          additionalProperties: false
          required:
            - ready
            - userId
          properties:
            ready:
              type: boolean
            userId:
              type: string
              format: uuid

    QuickPhrase:
      type: object
      additionalProperties: false
      required:
        - key
        - text
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        text:
          type: string
          minLength: 1
          maxLength: 240

    ChatThread:
      type: object
      additionalProperties: false
      required:
        - blocked
        - createdAt
        - matchId
        - muted
        - otherUser
        - threadId
      properties:
        blocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        matchId:
          type: string
          format: uuid
        muted:
          type: boolean
        otherUser:
          type: object
          additionalProperties: false
          required:
            - avatarKey
            - displayName
            - userId
          properties:
            avatarKey:
              type: string
            displayName:
              type: string
            userId:
              type: string
              format: uuid
        threadId:
          type: string
          format: uuid

    SendChatMessageRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - kind
            - text
          properties:
            kind:
              type: string
              const: typed
            text:
              type: string
              minLength: 1
              maxLength: 2048
        - type: object
          additionalProperties: false
          required:
            - kind
            - quickPhraseKey
          properties:
            kind:
              type: string
              const: quick_phrase
            quickPhraseKey:
              type: string
              minLength: 1
              maxLength: 64

    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - body
        - kind
        - messageId
        - recipientUserId
        - senderUserId
        - sentAt
        - threadId
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2048
        kind:
          type: string
          enum:
            - typed
            - quick_phrase
        messageId:
          type: string
          format: uuid
        quickPhraseKey:
          type: string
        recipientUserId:
          type: string
          format: uuid
        senderUserId:
          type: string
          format: uuid
        sentAt:
          type: string
          format: date-time
        threadId:
          type: string
          format: uuid

    ChatMessageAttempt:
      type: object
      additionalProperties: false
      required:
        - body
        - deliveryStatus
        - kind
        - messageId
        - recipientUserId
        - senderUserId
        - sentAt
        - threadId
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2048
        deliveryStatus:
          type: string
          enum:
            - blocked
            - delivered
            - provider_unavailable
            - rate_limited
            - recipient_unavailable
        kind:
          type: string
          enum:
            - typed
            - quick_phrase
        messageId:
          type: string
          format: uuid
        quickPhraseKey:
          type: string
        recipientUserId:
          type: string
          format: uuid
        senderUserId:
          type: string
          format: uuid
        sentAt:
          type: string
          format: date-time
        threadId:
          type: string
          format: uuid

    ChatAttemptOrError:
      oneOf:
        - $ref: "#/components/schemas/ChatMessageAttempt"
        - $ref: "#/components/schemas/ErrorResponse"

    ChatMessagePage:
      type: object
      additionalProperties: false
      required:
        - hasMore
        - messages
      properties:
        hasMore:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    SafetyRelationship:
      type: object
      additionalProperties: false
      required:
        - active
        - matchId
        - subjectUserId
      properties:
        active:
          type: boolean
          const: true
        matchId:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid

    ReportCategory:
      type: string
      enum:
        - harassment
        - hate
        - other
        - self_harm
        - sexual
        - spam
        - threat

    ReportReceipt:
      type: object
      additionalProperties: false
      required:
        - category
        - kind
        - matchId
        - reportId
        - status
        - subjectUserId
      properties:
        category:
          $ref: "#/components/schemas/ReportCategory"
        kind:
          type: string
          enum:
            - message
            - user
        matchId:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        subjectUserId:
          type: string
          format: uuid

    RealtimeEvent:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - eventId
        - type
        - occurredAt
        - matchId
        - matchVersion
        - recipientCursor
        - audience
        - payload
      properties:
        schemaVersion:
          type: integer
          const: 1
        eventId:
          type: string
          format: uuid
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
        matchId:
          type: string
          format: uuid
        matchVersion:
          type: integer
          minimum: 1
        recipientCursor:
          type: integer
          minimum: 1
        audience:
          type: string
          enum:
            - player
            - participants
            - active
        recipientUserId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true

    RealtimeEventPage:
      type: object
      additionalProperties: false
      required:
        - events
        - hasMore
        - nextCursor
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RealtimeEvent"
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiError"

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: Stable machine-readable error code.
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Safe human-readable explanation.
        traceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Identifier supplied when contacting support.
        details:
          type: object
          additionalProperties: true
          description: Safe structured context specific to the error code.

    PageMetadata:
      type: object
      additionalProperties: false
      required:
        - hasMore
      properties:
        hasMore:
          type: boolean
          description: Whether another page can be requested.
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque cursor for the next page; absent on the final page.

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing, expired, or invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account cannot perform this operation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current authoritative state.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: A rate limit has been exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: The server could not safely complete the request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested account or profile does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Identity services are unavailable or not configured.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
